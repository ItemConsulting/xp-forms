plugins {
  id "java"
  id "maven-publish"
  id "com.enonic.xp.app"
  id "com.github.node-gradle.node" version "7.1.0"
  id "no.item.xp.codegen" version "3.0.0-SNAPSHOT"
}

app {
  // The dev task below runs the npm watch, which the plugin's default dev task does not
  createDefaultDevTask = false
}

dependencies {
  compileOnly xplibs.api.core
  compileOnly xplibs.api.portal

  include xplibs.auth
  include xplibs.common
  include xplibs.content
  include xplibs.context
  include xplibs.event
  include xplibs.grid
  include xplibs.i18n
  include xplibs.mail
  include xplibs.node
  include xplibs.portal
  include xplibs.project

  include libs.lib.asset
  include libs.lib.http.client
  include libs.lib.freemarker
  include libs.lib.time
  include libs.lib.cloudflare.turnstile

  testImplementation xplibs.api.core
  testImplementation platform("org.junit:junit-bom:6.1.3")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

repositories {
  mavenCentral()
  xp.enonicRepo()
  maven { url = "https://repo.itemtest.no/releases" }
  maven { url = "https://repo.itemtest.no/snapshots" }
}

node {
  download = true
  version = file(".nvmrc").text.trim()
  // `npm ci` on CI, so the build uses exactly what package-lock.json pins
  npmInstallCommand = System.getenv("CI") ? "ci" : "install"
}

tasks.withType(Copy).configureEach {
  includeEmptyDirs = false
}

tasks.register("dev", NpmTask) {
  args = [
    "run",
    "watch"
  ]
  dependsOn npmInstall, deploy
  environment = [
    "FORCE_COLOR": "true",
  ]
}

tasks.register("npmCheck", NpmTask) {
  // check:types reads the types generated from the YAML descriptors
  dependsOn npmInstall, generateTypeScript
  args = [
    "run",
    "check"
  ]
  environment = [
    "FORCE_COLOR": "true",
  ]
}

// If you ALWAYS want to SKIP `test` and `check` tasks on development build, wrap this inside an "if..."
// if (!(project.hasProperty("dev") || project.hasProperty("development"))) {
check.dependsOn npmCheck
// }

/*
  The Java tests have the main resources folder on their classpath, and npmBuild writes into that same
  folder. They need nothing npmBuild makes, but Gradle refuses to run the two unordered in one build.
*/
test {
  useJUnitPlatform()
  mustRunAfter "npmBuild"
}

compileTestJava {
  mustRunAfter "npmBuild"
}

tasks.register("npmTest", NpmTask) {
  dependsOn npmInstall
  args = [
    "run",
    "test"
  ]
  environment = [
    "FORCE_COLOR": "true",
  ]
  inputs.dir "src/test"
  inputs.dir "src/main/resources"
  outputs.upToDateWhen { false }
}

check.dependsOn npmTest

tasks.register("npmBuild", NpmTask) {
  args = [
    "run",
    "--silent",
    project.hasProperty("dev") || project.hasProperty("development") ? "build" : "minify"
  ]
  dependsOn npmInstall
  environment = [
    "FORCE_COLOR": "true",
    "LOG_LEVEL_FROM_GRADLE": gradle.startParameter.logLevel.toString(),
    "NODE_ENV": project.hasProperty("dev") || project.hasProperty("development") ? "development" : "production"
  ]
  inputs.dir "src/main/resources"
  outputs.dir "build/resources/main"
}

jar.dependsOn npmBuild

processResources {
  exclude "**/.gitkeep"
  exclude "**/*.json"
  exclude "**/*.png"
  exclude "**/*.ts"
}

publishing {
  repositories {
    maven {
      name = "itemtestRepository"
      url = version.endsWith('SNAPSHOT')
        ? "https://repo.itemtest.no/snapshots"
        : "https://repo.itemtest.no/releases"
      credentials(PasswordCredentials)
      authentication {
        basic(BasicAuthentication)
      }
    }
  }
  publications {
    maven(MavenPublication) {
      from components.java
      groupId group
      artifactId projectName
      version version
    }
  }
}
