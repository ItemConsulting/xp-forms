name: Publish
on:
  # Called by CI once it has built a push to main or next (the prerelease branch, in changesets
  # pre mode)
  workflow_call:

  # Manual escape hatch: re-publish the jar for whatever version main (or next) is on. Use it when the
  # Gradle step below failed after the release was tagged, since a plain re-run finds nothing
  # to release.
  workflow_dispatch:

permissions:
  contents: write # push the version bump commit and the v<version> tag, create the release
  pull-requests: write # open and update the "Version Packages" PR

jobs:
  publish:
    # When called by CI, github.event_name is CI's event, which is always a push there (see the
    # publish job in main.yml), and a fork cannot push to this repository.
    # A manual run publishes whatever it has checked out, so it is only allowed from main and next.
    if: >-
      ${{ github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')) }}
    # One publish per branch at a time. CI's own concurrency already queues pushes to a branch,
    # this also covers a manual run.
    concurrency: publish-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # changeset publish tags the release, so the existing tags have to be there
          fetch-depth: 0
          # The action pushes the release commit and tags over the GitHub API, so
          # the checkout does not need to leave a git credential behind.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Publishing the jar means building it, so the publish job needs the same JDK as CI
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      # On an ordinary push to main this opens or updates the "Version Packages" PR.
      # Once that PR is merged package.json is already bumped and there are no
      # changesets left, so this runs `npm run release` instead. The package is
      # private, so `changeset publish` publishes nothing to npm: it only creates
      # the v<version> tag (privatePackages.tag in .changeset/config.json), which
      # the action pushes and makes a GitHub release of.
      - name: Create Release Pull Request or Tag Release
        id: changesets
        if: github.event_name != 'workflow_dispatch'
        uses: changesets/action@v2
        with:
          version-script: npm run versioning
          publish-script: npm run release
          create-github-releases: true

      # A manual run is a retry for a jar that never went out. If the version on main is already
      # in the releases repository there is nothing to retry, and publishing would overwrite it.
      - name: Check that the jar is not already published
        if: github.event_name == 'workflow_dispatch'
        run: |
          name=$(sed -n 's/^projectName *= *//p' gradle.properties)
          version=$(sed -n 's/^version *= *//p' gradle.properties)
          if [ -z "$name" ] || [ -z "$version" ]; then
            echo "::error::Could not read projectName and version from gradle.properties"
            exit 1
          fi
          case "$version" in *-SNAPSHOT) exit 0 ;; esac
          url="https://repo.itemtest.no/releases/no/item/$name/$version/$name-$version.pom"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          if [ "$status" = "200" ]; then
            echo "::error::$name $version is already published, refusing to overwrite it"
            exit 1
          elif [ "$status" != "404" ]; then
            echo "::error::Unexpected HTTP $status from $url"
            exit 1
          fi

      # Reached when the step above tagged a release, i.e. a "Version Packages"
      # PR was merged, or when the workflow was started by hand to retry.
      - name: Publish jar to repo.itemtest.no
        if: github.event_name == 'workflow_dispatch' || steps.changesets.outputs.published == 'true'
        run: ./gradlew publishAllPublicationsToItemtestRepositoryRepository
        env:
          # build.gradle declares the repository as `itemtestRepository` with
          # credentials(PasswordCredentials), which reads these two properties.
          ORG_GRADLE_PROJECT_itemtestRepositoryUsername: ${{ secrets.REPOSILITE_USERNAME }}
          ORG_GRADLE_PROJECT_itemtestRepositoryPassword: ${{ secrets.REPOSILITE_PASSWORD }}
