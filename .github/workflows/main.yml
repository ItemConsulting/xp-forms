# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI
on:
  # Only main and next (the prerelease branch), because every other branch is covered by
  # pull_request below. Keeping "**" here as well would run each pushed branch twice once it has a PR.
  push:
    branches:
      - main
      - next

  # A fork's commits live in the fork, so a push event never fires for them and a contributor's
  # pull request would otherwise get no CI at all.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main or next: it ends by publishing (see the publish job).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # The JDK the jar is compiled for, which differs between main and next (see .java-version)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@v6

      # Installs the npm dependencies with `npm ci` (via npmInstall, see build.gradle), runs check
      # (biome + tsc, via npmCheck) and the tests (via npmTest), compiles the Java sources, runs
      # tsdown and postcss (via npmBuild) and builds the jar.
      - run: ./gradlew build

  # Publish is called from here, rather than started by a workflow_run, so that it runs for the
  # branch and commit that was pushed: changesets/action takes both from GITHUB_REF and GITHUB_SHA,
  # which a workflow_run always sets to main, so a push to next would version and release main.
  publish:
    needs: build
    # Only a push publishes, and on.push only lists main and next (the prerelease branch, in
    # changesets pre mode). A pull request, a fork's included, never reaches this job.
    if: github.event_name == 'push'
    permissions:
      contents: write # push the version bump commit and the v<version> tag, create the release
      pull-requests: write # open and update the "Version Packages" PR
    uses: ./.github/workflows/publish.yml
    secrets: inherit
