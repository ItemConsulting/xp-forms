# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-content-type-8.0.0.json
kind: "ContentType"
superType: "base:structured"
title:
  text: "Form"
  i18n: "contentType.form.displayName"
description:
  text: "Tool to build"
  i18n: "contentType.form.description"
form:
  - type: "FieldSet"
    label:
      text: "Submission"
      i18n: "contentType.form.submission"
    items:
      - type: "CustomSelector"
        name: "integrationId"
        label:
          text: "Form type"
          i18n: "contentType.form.integrationId"
        occurrences:
          min: 0
          max: 1
        service: "form-integrations"
  - type: "ItemSet"
    name: "pages"
    label:
      text: "Page"
      i18n: "form-fragment.form-page-form.displayName"
    occurrences:
      min: 1
      max: 0
    items:
      - type: "FormFragment"
        name: "form-page-form"

  - type: "OptionSet"
    name: "reviewPage"
    expanded: false
    label:
      text: "Review page"
      i18n: "contentType.form.reviewPage"
    occurrences:
      min: 1
      max: 1
    options:
      - name: "showReviewPage"
        label:
          text: "Show review page"
          i18n: "form-fragment.form-page-review.displayName"
        items:
          - type: "FormFragment"
            name: "form-page-review"
    selection:
      min: 0
      max: 1

  - type: "ItemSet"
    name: "successPageSections"
    label:
      text: "Success page"
      i18n: "form-fragment.form-page-success.displayName"
    occurrences:
      min: 1
      max: 1
    items:
      - type: "FormFragment"
        name: "form-page-success"
