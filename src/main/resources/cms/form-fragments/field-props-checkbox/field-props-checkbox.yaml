# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-form-fragment-8.0.0.json
kind: "FormFragment"
title:
  text: "Properties for checkbox lists"
  i18n: "form-fragment.field-props-checkbox.displayName"
description:
  text: "Validation configuration for checkbox lists"
  i18n: "form-fragment.field-props-checkbox.description"
form:
  - type: "OptionSet"
    name: "properties"
    expanded: false
    label:
      text: "Properties"
      i18n: "form-fragment.field-props-checkbox.properties"
    occurrences:
      min: 1
      max: 1
    options:
      - name: "validationRequired"
        label:
          text: "Validation: Required"
          i18n: "form-fragment.field-props-checkbox.required"
        helpText:
          text: "This field must always have a value"
          i18n: "form-fragment.field-props-checkbox.requiredHelpText"
        items:
          - type: "TextLine"
            name: "errorMessage"
            label:
              text: "Error message"
              i18n: "form-fragment.field-props-checkbox.errorMessage"
            occurrences:
              min: 0
              max: 1
      - name: "validationMinItems"
        label:
          text: "Validation: min items"
          i18n: "form-fragment.field-props-checkbox.validationMinItems"
        helpText:
          text: "Specify min required items"
          i18n: "form-fragment.field-props-checkbox.validationMinItemsHelpText"
        items:
          - type: "Long"
            name: "minItems"
            label:
              text: "Min required"
              i18n: "form-fragment.field-props-checkbox.minItems"
            occurrences:
              min: 1
              max: 1
            default: 0
          - type: "TextLine"
            name: "errorMessage"
            label:
              text: "Error message"
              i18n: "form-fragment.field-props-checkbox.errorMessage"
            occurrences:
              min: 0
              max: 1
      - name: "validationMaxItems"
        label:
          text: "Validation: max items"
          i18n: "form-fragment.field-props-checkbox.validationMaxItems"
        helpText:
          text: "Specify max required items"
          i18n: "form-fragment.field-props-checkbox.validationMaxItemsHelpText"
        items:
          - type: "Long"
            name: "maxItems"
            label:
              text: "Max required"
              i18n: "form-fragment.field-props-checkbox.maxItems"
            occurrences:
              min: 1
              max: 1
            default: 1
          - type: "TextLine"
            name: "errorMessage"
            label:
              text: "Error message"
              i18n: "form-fragment.field-props-checkbox.errorMessage"
            occurrences:
              min: 0
              max: 1
    selection:
      min: 0
      max: 0
