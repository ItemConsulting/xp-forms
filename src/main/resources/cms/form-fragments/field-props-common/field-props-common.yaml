# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-form-fragment-8.0.0.json
kind: "FormFragment"
title:
  text: "Common properties"
  i18n: "mixin.fieldPropsCommon.displayName"
description:
  text: "Common properties for form fields"
  i18n: "mixin.fieldPropsCommon.description"
form:
  - type: "TextLine"
    name: "label"
    label:
      text: "Label"
      i18n: "mixin.fieldPropsCommon.label"
    occurrences:
      min: 1
      max: 1
  - type: "TextLine"
    name: "name"
    label:
      text: "name"
      i18n: "mixin.fieldPropsCommon.name"
    helpText:
      text: "Programmatic name for the field"
      i18n: "mixin.fieldPropsCommon.nameHelpText"
    occurrences:
      min: 0
      max: 1
    regexp: "^\\S+$"
  - type: "HtmlArea"
    name: "helpText"
    label:
      text: "Help text"
      i18n: "mixin.fieldPropsCommon.helpText"
    helpText:
      text: "Text displayed beneath the \"field name\""
      i18n: "mixin.fieldPropsCommon.helpTextHelpText"
    occurrences:
      min: 0
      max: 1
  - type: "TextLine"
    name: "value"
    label:
      text: "Initialize field with this value"
      i18n: "mixin.fieldPropsCommon.value"
    occurrences:
      min: 0
      max: 1
