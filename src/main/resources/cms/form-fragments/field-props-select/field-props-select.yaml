# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-form-fragment-8.0.0.json
kind: "FormFragment"
title:
  text: "Common selection fields"
  i18n: "mixin.fieldPropsSelect.displayName"
description:
  text: "Fields that are common for select and input[type=radio]"
  i18n: "mixin.fieldPropsSelect.description"
form:
  - type: "OptionSet"
    name: "properties"
    expanded: false
    label:
      text: "Properties"
      i18n: "mixin.fieldPropsSelect.properties"
    occurrences:
      min: 1
      max: 1
    options:
      - name: "validationRequired"
        label:
          text: "Validation: Required"
          i18n: "mixin.fieldPropsSelect.required"
        helpText:
          text: "This field must always have a value"
          i18n: "mixin.fieldPropsSelect.requiredHelpText"
        items:
          - type: "TextLine"
            name: "errorMessage"
            label:
              text: "Error message"
              i18n: "mixin.fieldPropsSelect.errorMessage"
            occurrences:
              min: 0
              max: 1
    selection:
      min: 0
      max: 0
