# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-form-fragment-8.0.0.json
kind: "FormFragment"
title:
  text: "Hidden field"
  i18n: "form-fragment.input-hidden.displayName"
description:
  text: "Field that is hidden from users"
  i18n: "form-fragment.input-hidden.description"
form:
  - type: "TextLine"
    name: "name"
    label:
      text: "name"
      i18n: "form-fragment.input-hidden.name"
    helpText:
      text: "Programmatic name for the field"
      i18n: "form-fragment.input-hidden.nameHelpText"
    occurrences:
      min: 1
      max: 1
    regexp: "^\\S+$"
  - type: "TextLine"
    name: "value"
    label:
      text: "Initialize field with this value"
      i18n: "form-fragment.input-hidden.value"
    occurrences:
      min: 0
      max: 1
