# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-form-fragment-8.0.0.json
kind: "FormFragment"
title:
  text: "Form fields"
  i18n: "mixin.fields.displayName"
form:
  - type: "OptionSet"
    name: "fields"
    expanded: false
    label:
      text: "Field"
      i18n: "mixin.fields.field"
    helpText:
      text: "Input fields in your form"
      i18n: "mixin.fields.fieldHelpText"
    occurrences:
      min: 1
      max: 0
    options:
      - name: "input"
        label:
          text: "Input field"
          i18n: "mixin.fields.input"
        helpText:
          text: "Single line text field"
          i18n: "mixin.fields.inputHelpText"
        items:
          - type: "FormFragment"
            name: "field-props-common"
          - type: "FormFragment"
            name: "field-props-input"
      - name: "textarea"
        label:
          text: "TextArea field"
          i18n: "mixin.fields.textarea"
        helpText:
          text: "Multiple line text field"
          i18n: "mixin.fields.textareaHelpText"
        items:
          - type: "FormFragment"
            name: "field-props-common"
          - type: "Long"
            name: "rows"
            label:
              text: "Rows"
              i18n: "mixin.fields.rows"
            occurrences:
              min: 0
              max: 1
          - type: "Long"
            name: "cols"
            label:
              text: "Columns"
              i18n: "mixin.fields.cols"
            occurrences:
              min: 0
              max: 1
          - type: "FormFragment"
            name: "field-props-input"
      - name: "radiobuttons"
        label:
          text: "Radio buttons field"
          i18n: "mixin.fields.radioButtons"
        helpText:
          text: "Users choose single answer from list of options"
          i18n: "mixin.fields.radioButtonsHelpText"
        items:
          - type: "FormFragment"
            name: "field-props-common"
          - type: "FormFragment"
            name: "options"
          - type: "FormFragment"
            name: "field-props-select"
      - name: "select"
        label:
          text: "Select field"
          i18n: "mixin.fields.select"
        helpText:
          text: "Users select single answer from list of options"
          i18n: "mixin.fields.selectHelpText"
        items:
          - type: "FormFragment"
            name: "field-props-common"
          - type: "FormFragment"
            name: "options"
          - type: "FormFragment"
            name: "field-props-select"
      - name: "checkboxes"
        label:
          text: "Checkboxes"
          i18n: "mixin.fields.checkboxes"
        helpText:
          text: "Users choose multiple answers from list of options"
          i18n: "mixin.fields.checkboxesHelpText"
        items:
          - type: "TextLine"
            name: "label"
            label:
              text: "Label"
              i18n: "mixin.fieldPropsCommon.label"
            occurrences:
              min: 1
              max: 1
          - type: "TextLine"
            name: "name"
            label:
              text: "name"
              i18n: "mixin.fieldPropsCommon.name"
            helpText:
              text: "Programmatic name for the field"
              i18n: "mixin.fieldPropsCommon.nameHelpText"
            occurrences:
              min: 0
              max: 1
            regexp: "^\\S+$"
          - type: "HtmlArea"
            name: "helpText"
            label:
              text: "Help text"
              i18n: "mixin.fieldPropsCommon.helpText"
            helpText:
              text: "Text displayed beneath the \"field name\""
              i18n: "mixin.fieldPropsCommon.helpTextHelpText"
            occurrences:
              min: 0
              max: 1
            exclude: "*"
            include: "Bold Italic | RemoveFormat | SpecialChar Macro | Link Unlink"
          - type: "TextLine"
            name: "value"
            label:
              text: "Initialize field with this value"
              i18n: "mixin.fieldPropsCommon.value"
            occurrences:
              min: 0
              max: 0
          # Not the "options" fragment, since a single checkbox (such as accepting terms) is allowed
          - type: "ItemSet"
            name: "options"
            label:
              text: "Options"
              i18n: "mixin.options.options"
            occurrences:
              min: 1
              max: 0
            items:
              - type: "TextLine"
                name: "text"
                label:
                  text: "Text"
                  i18n: "mixin.options.text"
                occurrences:
                  min: 1
                  max: 1
              - type: "TextLine"
                name: "value"
                label:
                  text: "Value"
                  i18n: "mixin.options.value"
                helpText:
                  text: "Value to submit if this alternative is chosen"
                  i18n: "mixin.options.valueHelpText"
                occurrences:
                  min: 1
                  max: 1
          - type: "FormFragment"
            name: "field-props-checkbox"
      - name: "hidden"
        label:
          text: "Hidden field"
          i18n: "mixin.fields.hidden"
        helpText:
          text: "Field that is hidden from users"
          i18n: "mixin.fields.hiddenHelpText"
        items:
          - type: "TextLine"
            name: "name"
            label:
              text: "name"
              i18n: "mixin.fields.hidden.name"
            helpText:
              text: "Programmatic name for the field"
              i18n: "mixin.fields.hidden.nameHelpText"
            occurrences:
              min: 1
              max: 1
            regexp: "^\\S+$"
          - type: "TextLine"
            name: "value"
            label:
              text: "Initialize field with this value"
              i18n: "mixin.fields.hidden.value"
            occurrences:
              min: 0
              max: 1
    selection:
      min: 1
      max: 1
