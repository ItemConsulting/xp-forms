# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-form-fragment-8.0.0.json
kind: "FormFragment"
title:
  text: "Success page"
  i18n: "form-fragment.form-page-success.displayName"
form:
  - type: "HtmlArea"
    name: "text"
    label:
      text: "Text"
      i18n: "form-fragment.form-page-success.text"
