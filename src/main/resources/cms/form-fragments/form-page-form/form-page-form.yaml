# yaml-language-server: $schema=https://www.schemastore.org/enonic-xp-form-fragment-8.0.0.json
kind: "FormFragment"
title:
  text: "Page"
  i18n: "form-fragment.form-page-form.displayName"
form:
  - type: "TextLine"
    name: "title"
    label:
      text: "Title"
      i18n: "form-fragment.form-page-form.title"
    occurrences:
      min: 1
      max: 1

  - type: "HtmlArea"
    name: "text"
    label:
      text: "Page description"
      i18n: "form-fragment.form-page-form.pageDescription"
    occurrences:
      min: 0
      max: 1
    exclude: "*"
    include: "Bold Italic | RemoveFormat | SpecialChar Macro | Link Unlink"

  - type: "FormFragment"
    name: "fields"
  - type: "TextLine"
    name: "submitButtonText"
    label:
      text: "Submit button text"
      i18n: "form-fragment.form-page-form.submitButtonText"
    occurrences:
      min: 1
      max: 1
    default: "Neste"
